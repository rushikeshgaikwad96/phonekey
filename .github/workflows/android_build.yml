name: Build PhoneKey Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      id: setup-android

    - name: Create local.properties
      working-directory: ./android
      run: |
        echo "sdk.dir=${{ steps.setup-android.outputs.sdk-path }}" > local.properties
        cat local.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Android Debug APK
      working-directory: ./android
      env:
        ANDROID_HOME: ${{ steps.setup-android.outputs.sdk-path }}
        ANDROID_SDK_ROOT: ${{ steps.setup-android.outputs.sdk-path }}
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneKey-Android-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk
